<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ document.title }} - プレーン表示</title>
    <style>
        /* リセットCSS */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            background-color: #ffffff;
        }
        
        /* コンテンツコンテナ */
        .plain-content {
            width: 100%;
            min-height: 100vh;
            overflow-x: auto; /* 横スクロールを有効にする */
            overflow-y: auto; /* 縦スクロールを有効にする */
        }
        
        /* 幅の広いコンテンツに対応 */
        .plain-content table {
            min-width: max-content; /* テーブルの最小幅を内容に合わせる */
        }
        
        .plain-content pre {
            overflow-x: auto; /* preタグ内の横スクロール */
            white-space: pre; /* 改行を保持 */
        }
        
        /* プレーンビューヘッダー（オプション） */
        .plain-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            font-size: 14px;
            color: #6c757d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .plain-header .document-title {
            font-weight: bold;
            color: #495057;
        }
        
        /* メインコンテンツエリア */
        .main-content {
            padding: 15px;
            width: max-content; /* 内容の幅に合わせる */
            min-width: 100%; /* 最小幅は100% */
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .plain-header {
                padding: 8px 10px;
                font-size: 12px;
            }
            
            .main-content {
                padding: 10px;
            }
        }
        
        /* 印刷対応 */
        @media print {
            .plain-header {
                display: none;
            }
            
            .main-content {
                padding: 0;
            }
            
            body {
                background-color: white;
            }
        }
    </style>
</head>
<body>
    <!-- ヘッダー（オプション - 不要な場合は削除） -->
    <div class="plain-header">
        <span class="document-title">{{ document.title }}</span>
        <span style="float: right;">プレーン表示</span>
    </div>
    
    <!-- メインコンテンツ -->
    <div class="plain-content">
        <div class="main-content">
            {{ content_html|safe }}
        </div>
    </div>
</body>
</html>

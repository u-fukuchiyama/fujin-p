<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>承認案件一覧 - 研究倫理審査</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
            background: linear-gradient(135deg, #4a3a7a 0%, #6d5fb8 100%);
            min-height: 100vh; padding: 15px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: white; padding: 16px 24px; border-radius: 10px;
            margin-bottom: 14px; display: flex; align-items: center;
            gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { flex: 1; font-size: 1.3rem; color: #4a3a7a; min-width: 160px; }
        .nav-btn {
            padding: 9px 16px; background: #94a3b8; color: white; border: none;
            border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.88rem;
        }
        .nav-btn:hover { opacity: 0.9; }
        .card {
            background: white; border-radius: 10px; padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 1rem; color: #4a3a7a; font-weight: 700;
            border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 14px;
        }
        .ctrl-bar { margin-bottom: 12px; font-size: 0.86rem; }
        .ctrl-bar select {
            padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.86rem;
        }
        .approved-item {
            border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 14px 16px; margin-bottom: 10px; background: #f8fafc;
        }
        .approved-item .title { font-size: 0.95rem; font-weight: 700; color: #4a3a7a; }
        .approved-item .meta {
            font-size: 0.82rem; color: #6b7280; margin-top: 5px; line-height: 1.7;
        }
        .approved-item .case-id { font-family: monospace; color: #6d5fb8; font-weight: 600; }
        .approved-badge {
            display: inline-block; padding: 2px 9px; border-radius: 10px;
            font-size: 0.72rem; font-weight: 700; background: #d1fae5; color: #065f46;
        }
        .empty-msg { text-align: center; color: #9ca3af; padding: 28px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✅ 承認案件一覧</h1>
        <a href="{{ url_for('ethics_review.index') }}" class="nav-btn">← トップへ</a>
        <a href="{{ url_for('ethics_review.public_view') }}" class="nav-btn">受付状況一覧</a>
    </div>

    <div class="card">
        <h2>承認された研究課題</h2>
        <div class="ctrl-bar">
            年度：
            <select id="sel-fy">
                <option value="">すべて</option>
                {% for y in range(current_fy, current_fy - 6, -1) %}
                <option value="{{ y }}">{{ y }}年度</option>
                {% endfor %}
            </select>
        </div>
        <div id="list">
            <div class="empty-msg">読み込み中…</div>
        </div>
    </div>
</div>

<script>
const URL_BASE = '{{ url_for("ethics_review.index") }}';

function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadApproved() {
    const fy = $('#sel-fy').val();
    const params = {};
    if (fy) params.fiscal_year = fy;
    $.get(URL_BASE + 'api/public/approved', params, function(resp) {
        if (!resp.success) {
            $('#list').html('<div class="empty-msg" style="color:#ef4444">' + esc(resp.error || '読み込み失敗') + '</div>');
            return;
        }
        if (!resp.cases.length) {
            $('#list').html('<div class="empty-msg">承認済みの案件はありません</div>');
            return;
        }
        let html = '';
        resp.cases.forEach(c => {
            let chairPart = '';
            if (c.chair_name) {
                chairPart = '担当委員長：' + esc(c.chair_name);
                if (c.original_chair_name) {
                    chairPart += '（元：' + esc(c.original_chair_name) + '）';
                }
            }
            html += `
            <div class="approved-item">
                <div class="title">${esc(c.title) || '（無題）'}</div>
                <div class="meta">
                    <span class="case-id">${esc(c.case_display_id)}</span>
                    <span class="approved-badge">承認</span><br>
                    申請者：${esc(c.applicant_name)}${c.applicant_affiliation ? '（' + esc(c.applicant_affiliation) + '）' : ''}<br>
                    ${c.research_period_start || c.research_period_end ? '研究期間：' + (c.research_period_start || '—') + ' 〜 ' + (c.research_period_end || '—') + '<br>' : ''}
                    承認日：${c.approved_date || '—'}
                    ${chairPart ? '<br>' + chairPart : ''}
                </div>
            </div>`;
        });
        $('#list').html(html);
    }).fail(() => {
        $('#list').html('<div class="empty-msg" style="color:#ef4444">通信エラー</div>');
    });
}

$('#sel-fy').on('change', loadApproved);
$(document).ready(loadApproved);
</script>
</body>
</html>

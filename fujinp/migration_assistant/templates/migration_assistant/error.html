<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まいあし - お知らせ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Meiryo', sans-serif; background: linear-gradient(135deg, #6a1b9a, #ab47bc);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { background: #fff; border-radius: 14px; padding: 44px 36px; max-width: 480px; width: 100%;
         text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.25); }
  .icon { font-size: 56px; margin-bottom: 14px; }
  h1 { font-size: 22px; color: #333; margin-bottom: 12px; }
  p { color: #555; line-height: 1.7; margin-bottom: 26px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none;
         cursor: pointer; border: 1px solid #c0392b; }
  .btn-return { background: #fff; color: #c0392b; }
  .btn-return:hover { background: #fdecea; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">👣</div>
    <h1>まいあし</h1>
    <p>{{ error or 'このページを表示できませんでした' }}</p>
    <div class="btns">
      <a class="btn btn-return" href="{{ url_for('migration_assistant.return_to_fujin') }}">FUJIN-P に戻る</a>
    </div>
  </div>
</body>
</html>

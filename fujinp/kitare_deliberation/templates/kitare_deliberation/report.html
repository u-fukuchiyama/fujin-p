<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年度報告 - キターレオンライン審議</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
            background: linear-gradient(135deg, #4a3a7a 0%, #6d5fb8 100%);
            min-height: 100vh; padding: 15px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white; padding: 16px 24px; border-radius: 10px;
            margin-bottom: 14px; display: flex; align-items: center;
            gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { flex: 1; font-size: 1.3rem; color: #4a3a7a; min-width: 160px; }
        .nav-btn {
            padding: 9px 16px; background: #6d5fb8; color: white; border: none;
            border-radius: 6px; cursor: pointer; text-decoration: none;
            font-size: 0.88rem; font-weight: 600;
        }
        .nav-btn.secondary { background: #94a3b8; }
        .nav-btn:hover { opacity: 0.9; }
        .card {
            background: white; border-radius: 10px; padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 14px;
        }
        .card h2 {
            font-size: 1rem; color: #4a3a7a; font-weight: 700;
            border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 14px;
        }
        .ctrl-bar { font-size: 0.86rem; display: flex; gap: 10px; align-items: center; }
        .ctrl-bar select {
            padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.86rem;
        }
        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;
        }
        .summary-box {
            background: #f8fafc; border-radius: 8px; padding: 14px;
            text-align: center; border: 1px solid #e5e7eb;
        }
        .summary-box .num { font-size: 1.6rem; font-weight: 700; color: #4a3a7a; }
        .summary-box .lbl { font-size: 0.78rem; color: #6b7280; margin-top: 3px; }
        .summary-box.in_review .num { color: #92400e; }
        .summary-box.approved .num { color: #065f46; }
        .summary-box.rejected .num, .summary-box.not_accepted .num { color: #991b1b; }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th, td { padding: 8px 9px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background: #f8fafc; color: #6b7280; font-weight: 600; font-size: 0.76rem; white-space: nowrap; }
        .case-id { font-family: monospace; font-weight: 600; color: #6d5fb8; }
        .status-badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 0.7rem; font-weight: 700; white-space: nowrap;
        }
        .status-channel_open, .status-documents_uploading { background: #e0e7ff; color: #3730a3; }
        .status-submitted { background: #ddd6fe; color: #5b21b6; }
        .status-accepted_review { background: #fef3c7; color: #92400e; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .status-rejected, .status-not_accepted { background: #fee2e2; color: #991b1b; }
        .status-withdrawn, .status-terminated { background: #f3f4f6; color: #6b7280; }
        .personnel-tag {
            display: inline-block; padding: 1px 6px; border-radius: 7px;
            font-size: 0.68rem; font-weight: 700; background: #fde68a; color: #92400e;
            margin-left: 4px;
        }
        .empty-msg { text-align: center; color: #9ca3af; padding: 24px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📈 年度報告 — キターレオンライン審議</h1>
        <a href="{{ url_for('kitare_deliberation.index') }}" class="nav-btn secondary">← トップへ</a>
        <a id="btn-csv" href="#" class="nav-btn">CSVダウンロード</a>
    </div>

    <div class="card">
        <div class="ctrl-bar">
            <label>年度：</label>
            <select id="sel-fy">
                {% for y in range(current_fy, current_fy - 6, -1) %}
                <option value="{{ y }}" {% if y == current_fy %}selected{% endif %}>{{ y }}年度</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="card">
        <h2>集計</h2>
        <div class="summary-grid" id="summary">
            <div class="empty-msg" style="grid-column:1/-1">読み込み中…</div>
        </div>
    </div>

    <div class="card">
        <h2>案件一覧</h2>
        <div style="overflow-x:auto">
            <table>
                <thead><tr>
                    <th>案件番号</th><th>案件名</th><th>申請者</th>
                    <th>受付日</th><th>審議期日</th><th>終局日</th><th>ステータス</th>
                </tr></thead>
                <tbody id="tbody">
                    <tr><td colspan="7" class="empty-msg">読み込み中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const STATUS_LABELS = {{ status_labels | tojson }};
const URL_BASE = '{{ url_for("kitare_deliberation.index") }}';
function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function loadReport() {
    const fy = $('#sel-fy').val();
    $('#btn-csv').attr('href', URL_BASE + 'api/report/csv?fiscal_year=' + fy);
    $.get(URL_BASE + 'api/report', { fiscal_year: fy }, function(resp) {
        if (!resp.success) {
            $('#summary').html('<div class="empty-msg" style="grid-column:1/-1;color:#ef4444">' + esc(resp.error) + '</div>');
            return;
        }
        const s = resp.summary;
        const boxes = [
            { k:'total',        lbl:'総件数',   cls:'' },
            { k:'in_review',    lbl:'審議中',   cls:'in_review' },
            { k:'approved',     lbl:'可決',     cls:'approved' },
            { k:'rejected',     lbl:'否決',     cls:'rejected' },
            { k:'not_accepted', lbl:'不受理',   cls:'not_accepted' },
            { k:'withdrawn',    lbl:'取り下げ', cls:'' },
            { k:'terminated',   lbl:'打ち切り', cls:'' },
        ];
        let sumHtml = '';
        boxes.forEach(b => {
            sumHtml += `<div class="summary-box ${b.cls}">
                <div class="num">${s[b.k] != null ? s[b.k] : 0}</div>
                <div class="lbl">${b.lbl}</div>
            </div>`;
        });
        $('#summary').html(sumHtml);

        if (!resp.cases.length) {
            $('#tbody').html('<tr><td colspan="7" class="empty-msg">該当する案件はありません</td></tr>');
            return;
        }
        let rows = '';
        resp.cases.forEach(c => {
            rows += `<tr>
                <td><span class="case-id">${esc(c.case_display_id)}</span></td>
                <td>${esc(c.title)}${c.is_personnel ? '<span class="personnel-tag">特定</span>' : ''}</td>
                <td>${esc(c.applicant_name) || '—'}</td>
                <td>${c.received_date || '—'}</td>
                <td>${c.deadline || '—'}</td>
                <td>${c.final_date || '—'}</td>
                <td><span class="status-badge status-${c.status}">${esc(c.status_label)}</span></td>
            </tr>`;
        });
        $('#tbody').html(rows);
    }).fail(() => {
        $('#summary').html('<div class="empty-msg" style="grid-column:1/-1;color:#ef4444">通信エラー</div>');
    });
}
$('#sel-fy').on('change', loadReport);
$(document).ready(loadReport);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可決案件一覧 - キターレオンライン審議</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
            background: linear-gradient(135deg, #4a3a7a 0%, #6d5fb8 100%);
            min-height: 100vh; padding: 15px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: white; padding: 16px 24px; border-radius: 10px;
            margin-bottom: 14px; display: flex; align-items: center;
            gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { flex: 1; font-size: 1.3rem; color: #4a3a7a; min-width: 160px; }
        .nav-btn {
            padding: 9px 16px; background: #94a3b8; color: white; border: none;
            border-radius: 6px; cursor: pointer; text-decoration: none;
            font-size: 0.88rem; font-weight: 600;
        }
        .nav-btn:hover { opacity: 0.9; }
        .card {
            background: white; border-radius: 10px; padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 1rem; color: #4a3a7a; font-weight: 700;
            border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 14px;
        }
        .ctrl-bar { margin-bottom: 12px; font-size: 0.86rem; }
        .ctrl-bar select {
            padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.86rem;
        }
        .approved-item {
            border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 14px 16px; margin-bottom: 10px; background: #f8fafc;
        }
        .approved-item .title { font-size: 0.95rem; font-weight: 700; color: #4a3a7a; }
        .approved-item .meta {
            font-size: 0.82rem; color: #6b7280; margin-top: 5px; line-height: 1.7;
        }
        .approved-item .case-id { font-family: monospace; color: #6d5fb8; font-weight: 600; }
        .approved-badge {
            display: inline-block; padding: 2px 9px; border-radius: 10px;
            font-size: 0.72rem; font-weight: 700; background: #d1fae5; color: #065f46;
        }
        .empty-msg { text-align: center; color: #9ca3af; padding: 28px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✅ 北近畿地域連携機構オンライン審議　可決案件一覧</h1>
        <a href="{{ url_for('kitare_deliberation.index') }}" class="nav-btn">← トップへ</a>
        <a href="{{ url_for('kitare_deliberation.public_view') }}" class="nav-btn">受付状況一覧</a>
    </div>
    <div class="card">
        <h2>可決された案件</h2>
        <div class="ctrl-bar">
            年度：
            <select id="sel-fy">
                <option value="" {% if not selected_fy %}selected{% endif %}>すべて</option>
                {% for y in range(current_fy, current_fy - 6, -1) %}
                <option value="{{ y }}" {% if selected_fy == y %}selected{% endif %}>{{ y }}年度</option>
                {% endfor %}
            </select>
        </div>
        <div id="list">
        {% if error %}
            <div class="empty-msg" style="color:#ef4444">{{ error }}</div>
        {% elif not cases %}
            <div class="empty-msg">可決された案件はありません</div>
        {% else %}
            {% for c in cases %}
            <div class="approved-item">
                <div class="title">{{ c.title or '（無題）' }}</div>
                <div class="meta">
                    <span class="case-id">{{ c.case_display_id }}</span>
                    <span class="approved-badge">可決</span><br>
                    可決日：{{ c.approved_date or '—' }}
                </div>
            </div>
            {% endfor %}
        {% endif %}
        </div>
    </div>
</div>

<script>
// 年度を選ぶと ?fiscal_year= を付けて読み直す（一覧はサーバ側で描く）
document.getElementById('sel-fy').addEventListener('change', function() {
    const fy = this.value;
    location.href = location.pathname + (fy ? '?fiscal_year=' + encodeURIComponent(fy) : '');
});
</script>
</body>
</html>

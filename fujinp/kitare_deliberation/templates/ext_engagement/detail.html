                         $('#btn-motion-create').prop('disabled', false).text('📌 提案を出す'); }
            },
            error: () => { toast('通信エラー', true);
                           $('#btn-motion-create').prop('disabled', false).text('📌 提案を出す'); },
        });
    });

    // 委員：提案への意見表明
    $(document).on('click', '#btn-motion-vote', function() {
        const mid      = $(this).data('mid');
        const isRemark = $(this).data('remark') === 1 || $(this).data('remark') === '1';
        const vote     = isRemark ? 'remark' : $('input[name="mvchoice"]:checked').val();
        if (!vote) { toast('賛成／修正意見あり／反対 のいずれかを選んでください', true); return; }
        const comment = $('#motion-vote-comment').val().trim();
        if (isRemark && !comment) { toast('発言内容を入力してください', true); return; }
        $(this).prop('disabled', true).text('送信中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/motion/${mid}/vote`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ vote, comment }),
            success(resp) {
                if (resp.success) { toast(isRemark ? '発言を記録しました' : '提案への意見を表明しました', false); loadCase(); }
                else { toast('エラー: ' + resp.error, true);
                       $('#btn-motion-vote').prop('disabled', false).text('意見を表明する'); }
            },
            error: () => { toast('通信エラー', true);
                           $('#btn-motion-vote').prop('disabled', false).text('意見を表明する'); },
        });
    });

    // 委員長：採択／取り下げ
    function closeMotion(mid, action, btn) {
        const note   = $('#motion-close-note').val().trim();
        const notify = $('#motion-close-notify').is(':checked');
        const label  = action === 'adopt' ? '採択' : '取り下げ';
        if (!confirm(`この提案を${label}します。よろしいですか？`)) return;
        $(btn).prop('disabled', true);
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/motion/${mid}/close`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ action, note, notify }),
            success(resp) {
                if (resp.success) {
                    toast(action === 'adopt' ? '提案を採択しました。結論宣言パネルに引き継ぎました' : '提案を取り下げました', false);
                    loadCase();
                    if (action === 'adopt') setTimeout(() => { const el = document.getElementById('conclude-decision'); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 600);
                } else { toast('エラー: ' + resp.error, true); $(btn).prop('disabled', false); }
            },
            error: () => { toast('通信エラー', true); $(btn).prop('disabled', false); },
        });
    }
    $(document).on('click', '#btn-motion-adopt',    function() { closeMotion($(this).data('mid'), 'adopt', this); });
    $(document).on('click', '#btn-motion-withdraw', function() { closeMotion($(this).data('mid'), 'withdraw', this); });
}
bindMotionEvents();

// ─── 管理パネル：委員リスト描画 ───
function loadMembersForAdmin(coiInfo, actingChairInfo) {
    if (membersCache) {
        renderMemberList(membersCache, coiInfo, actingChairInfo);
        return;
    }
    $.get('/ext_engagement/api/committee_members', function(resp) {
        if (!resp.success) return;
        membersCache = resp.members;
        renderMemberList(resp.members, coiInfo, actingChairInfo);
    });
}

function renderMemberList(members, coiInfo, actingChairInfo) {
    const coiMap  = {};
    (coiInfo || []).forEach(r => { coiMap[r.user_id] = r; });
    const actingId = actingChairInfo ? actingChairInfo.id : null;
    // COIの設定・代理委員長の指名は事務局（管理者）のみが操作できる。
    // 委員長が見るときは現在の状態のバッジのみ表示する。
    const canEdit = IS_ADMIN;

    let html = '';
    members.forEach(m => {
        const coi = coiMap[m.id];
        const roleParts = [];
        if (m.is_chair)     roleParts.push('委員長');
        if (m.is_committee) roleParts.push('委員');

        let coiBadge = '', coiBtns = '';
        if (coi) {
            if (coi.excluded_roles === 'committee') {
                coiBadge = `<span class="coi-badge coi-committee">委員COI</span>`;
                if (canEdit)
                    coiBtns = `<button class="coi-btn coi-btn-clear" data-uid="${m.id}" data-action="coi-clear">COI解除</button>`;
            } else {
                coiBadge = `<span class="coi-badge coi-chair">委員長COI</span>`;
                if (canEdit)
                    coiBtns = `
                        <button class="coi-btn coi-btn-set" data-uid="${m.id}" data-action="coi-full">委員COIへ変更</button>
                        <button class="coi-btn coi-btn-clear" data-uid="${m.id}" data-action="coi-clear">COI解除</button>`;
            }
        } else {
            coiBadge = `<span class="coi-badge coi-none">参加可</span>`;
            if (canEdit) {
                const arr = [];
                if (m.is_committee)
                    arr.push(`<button class="coi-btn coi-btn-set" data-uid="${m.id}" data-action="coi-full" title="委員・委員長両方から除外">委員COI</button>`);
                if (m.is_chair)
                    arr.push(`<button class="coi-btn coi-btn-chair" data-uid="${m.id}" data-action="coi-chair" title="委員長役割のみ除外">委員長のみCOI</button>`);
                coiBtns = arr.join('');
            }
        }

        // ── 代行（代理委員長）指名 ──
        // 委員長プール＝委員全員。本来の委員長がCOI（chair_only）で抜けた場合に
        // 備え、委員のうち「委員COI（完全除外）でない者」の誰でも代行に指名できる。
        // 指名操作は事務局（管理者）のみが行う。
        const isFullyExcluded = coi && coi.excluded_roles === 'committee';
        let actingBtn = '';
        if (actingId === m.id) {
            // 既に代行に指名されている人
            if (canEdit)
                actingBtn = `<button class="coi-btn coi-btn-clear" data-uid="${m.id}" data-action="acting-clear">代理解除</button>`;
            coiBadge += ` <span class="coi-badge" style="background:#dbeafe;color:#1e40af;">代理委員長</span>`;
        } else if (canEdit && !isFullyExcluded) {
            // 完全除外（委員COI）でない委員は誰でも代行候補
            actingBtn = `<button class="coi-btn coi-btn-acting" data-uid="${m.id}" data-action="acting-set">代理委員長に指名</button>`;
        }

        html += `
        <div class="member-item">
            <span class="member-name">${escHtml(m.full_name)}</span>
            <span class="member-role">${roleParts.join('・')}</span>
            ${coiBadge}
            <div class="coi-controls">${coiBtns}${actingBtn}</div>
        </div>`;
    });
    $('#member-list').html(html || '<div style="color:#9ca3af;font-size:0.85rem">委員が登録されていません</div>');
}

// ─── イベントバインド ───
function bindEvents() {

    // 編集モーダル開放
    $(document).on('click', '#btn-open-edit', function() {
        if (!caseData) return;
        const c = caseData;
        $('#edit-application-no').val(c.application_no || '');
        $('#edit-is-new').val(c.is_new_application ? '1' : '0');
        $('#edit-title').val(c.title || '');
        $('#edit-org-name').val(c.org_name || '');
        $('#edit-content').val(c.content || '');
        $('#edit-period-start').val(c.period_start || '');
        $('#edit-period-end').val(c.period_end || '');
        $('#edit-research-fee').val(c.research_fee || '');
        // 直接経費・間接経費（新フィールド）
        $('#edit-direct-fee').val((c.direct_fee !== null && c.direct_fee !== undefined) ? c.direct_fee : '');
        $('#edit-indirect-fee').val((c.indirect_fee !== null && c.indirect_fee !== undefined) ? c.indirect_fee : '');
        updateEditTotalFeeDisplay();
        $('#edit-rep-name').val(c.representative_name || '');
        $('#edit-faculty-dept').val(c.faculty_dept || '');
        $('#edit-review-start').val(c.review_start || '');
        // datetime-local は 'YYYY-MM-DDTHH:MM' 形式。
        // サーバは 'YYYY-MM-DD HH:MM' で返すのでスペースを T に変換。
        $('#edit-review-end').val(c.review_end ? c.review_end.replace(' ', 'T') : '');
        $('#edit-pre-consultation').val(c.pre_consultation || '');
        $('#edit-doc-url').val(c.doc_url || '');
        editRepUserId = c.preferred_rep_user_id || null;
        $('#edit-rep-user-selected').html('');
        if (editRepUserId && caseData._preferred_rep_name) {
            showEditRepBadge(editRepUserId, caseData._preferred_rep_name);
        } else if (editRepUserId) {
            $('#edit-rep-user-selected').html(`<span class="user-selected-badge">👤 ID:${editRepUserId} <button class="clear-btn" id="btn-edit-clear-rep">✕</button></span>`);
        }
        $('#modal-edit').addClass('show');
    });
    $('#modal-edit-close, #btn-cancel-edit').on('click', () => $('#modal-edit').removeClass('show'));

    // 直接経費・間接経費 合計自動計算
    $(document).on('input', '#edit-direct-fee, #edit-indirect-fee', function() {
        updateEditTotalFeeDisplay();
    });

    // 編集保存
    $(document).on('click', '#btn-submit-edit', function() {
        const dVal = $('#edit-direct-fee').val().trim();
        const iVal = $('#edit-indirect-fee').val().trim();
        const payload = {
            application_no:        $('#edit-application-no').val().trim(),
            is_new_application:    $('#edit-is-new').val() === '1',
            title:                 $('#edit-title').val().trim(),
            org_name:              $('#edit-org-name').val().trim(),
            content:               $('#edit-content').val().trim(),
            research_fee:          $('#edit-research-fee').val().trim(),
            direct_fee:            dVal !== '' ? parseInt(dVal) : null,
            indirect_fee:          iVal !== '' ? parseInt(iVal) : null,
            period_start:          $('#edit-period-start').val(),
            period_end:            $('#edit-period-end').val(),
            representative_name:   $('#edit-rep-name').val().trim(),
            faculty_dept:          $('#edit-faculty-dept').val().trim(),
            preferred_rep_user_id: editRepUserId || null,
            pre_consultation:      $('#edit-pre-consultation').val().trim(),
            review_start:          $('#edit-review-start').val(),
            review_end:            $('#edit-review-end').val(),
            doc_url:               $('#edit-doc-url').val().trim(),
        };
        if (!payload.title || !payload.org_name) { toast('課題名と申請組織は必須です', true); return; }
        $(this).prop('disabled', true).text('保存中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/update`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify(payload),
            success(resp) {
                if (resp.success) { toast('保存しました', false); $('#modal-edit').removeClass('show'); membersCache = null; loadCase(); }
                else { toast('エラー: ' + resp.error, true); }
            },
            error: () => toast('通信エラー', true),
            complete: () => $('#btn-submit-edit').prop('disabled', false).text('保存する'),
        });
    });

    // ユーザ検索
    let editSearchTimer = null;
    $(document).on('input', '#edit-rep-user-search', function() {
        clearTimeout(editSearchTimer);
        const q = $(this).val().trim();
        if (!q) { $('#edit-rep-user-results').hide().html(''); return; }
        editSearchTimer = setTimeout(() => {
            $.get(API_USERS_SEARCH, { q }, function(resp) {
                if (!resp.success || !resp.users.length) {
                    $('#edit-rep-user-results').html('<div class="user-search-item" style="color:#9ca3af">該当なし</div>').show();
                    return;
                }
                let html = '';
                resp.users.forEach(u => {
                    html += `<div class="user-search-item edit-rep-item" data-id="${u.id}" data-name="${escHtml(u.full_name)}">${escHtml(u.full_name)}</div>`;
                });
                $('#edit-rep-user-results').html(html).show();
            });
        }, 300);
    });
    $(document).on('click', '.edit-rep-item', function() {
        editRepUserId = $(this).data('id');
        const name    = $(this).data('name');
        $('#edit-rep-user-results').hide().html('');
        $('#edit-rep-user-search').val('');
        showEditRepBadge(editRepUserId, name);
    });
    $(document).on('click', '#btn-edit-clear-rep', function() {
        editRepUserId = null;
        $('#edit-rep-user-selected').html('');
    });
    $(document).on('click', function(e) {
        if (!$(e.target).closest('.user-search-wrap').length) $('#edit-rep-user-results').hide();
    });

    // 審議開始宣言（審査期限・期日アラート・委員会通知を伴う）
    $(document).on('click', '#btn-send-review', function() {
        if (transitionBusy) return;   // 多重送信ガード
        const alertEnabled     = $('#send-alert-enabled').is(':checked');
        const reviewEnd        = $('#send-review-end').val();  // 'YYYY-MM-DDTHH:MM'
        const notifyCommittee  = $('#send-notify-committee').is(':checked');
        const chairMessage     = ($('#send-chair-message').val() || '').trim();
        if (!reviewEnd) {
            toast('審査期限（日時）を設定してください', true);
            return;
        }
        const isRereview = (caseData && (caseData.review_round || 1) >= 2);
        const lines = [];
        lines.push(isRereview
            ? '委員構成を確認し、審議を再開します。'
            : '委員構成と審査期限を確認し、審議を開始します。');
        lines.push(`審査期限：${reviewEnd.replace('T',' ')}`);
        lines.push(alertEnabled ? '期日アラート：ON' : '期日アラート：OFF');
        lines.push(notifyCommittee
            ? '委員会のSlackチャンネルへ通知します。'
            : '委員会への通知は行いません。');
        if (!confirm(lines.join('\n') + '\nよろしいですか？')) return;

        const btnLabel = isRereview ? '✅ 審議を開始／再開する' : '✅ 審議開始を宣言する';
        transitionBusy = true;   // 成功時は loadCase() 完了まで解除しない
        $(this).prop('disabled', true).text('宣言中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/send_to_review`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({
                alert_enabled:    alertEnabled,
                review_end:       reviewEnd,
                notify_committee: notifyCommittee,
                chair_message:    chairMessage,
            }),
            success(resp) {
                if (resp.success) {
                    if (resp.slack_notified && resp.slack_ok === false) {
                        toast('審議を開始しました（委員会への通知は失敗しました）', true);
                    } else if (resp.slack_notified) {
                        toast('審議を開始し、委員会へ通知しました', false);
                    } else {
                        toast('審議を開始しました', false);
                    }
                    membersCache = null; loadCase();   // 完了時に transitionBusy 解除
                } else {
                    toast('エラー: ' + resp.error, true);
                    transitionBusy = false;
                    $('#btn-send-review').prop('disabled', false).text(btnLabel);
                }
            },
            error: () => {
                toast('通信エラー', true);
                transitionBusy = false;
                $('#btn-send-review').prop('disabled', false).text(btnLabel);
            },
        });
    });

    // 取り下げモーダル
    $(document).on('click', '#btn-withdraw', function() {
        $('#withdraw-reason').val('');
        $('#modal-withdraw').addClass('show');
    });
    $('#modal-withdraw-close, #btn-cancel-withdraw').on('click', () => $('#modal-withdraw').removeClass('show'));

    // 取り下げ実行
    $(document).on('click', '#btn-submit-withdraw', function() {
        const reason = $('#withdraw-reason').val().trim();
        $(this).prop('disabled', true).text('処理中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/withdraw`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ reason }),
            success(resp) {
                if (resp.success) {
                    toast('取り下げました', false);
                    $('#modal-withdraw').removeClass('show');
                    membersCache = null;
                    loadCase();
                } else { toast('エラー: ' + resp.error, true); }
            },
            error: () => toast('通信エラー', true),
            complete: () => $('#btn-submit-withdraw').prop('disabled', false).text('取り下げる'),
        });
    });

    // 委員変更
    $(document).on('click', '#btn-change-round', function() {
        if (transitionBusy) return;   // 多重送信ガード
        if (!confirm('審議をやり直します。現在のコメントは参考情報として保持されます。よろしいですか？')) return;
        transitionBusy = true;   // 成功時は loadCase() 完了まで解除しない
        $(this).prop('disabled', true).text('処理中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/change_round`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({}),
            success(resp) {
                if (resp.success) {
                    toast(`第${resp.new_round}回の委員選定に移行しました`, false);
                    membersCache = null; loadCase();   // 完了時に transitionBusy 解除
                } else {
                    toast('エラー: ' + resp.error, true);
                    transitionBusy = false;
                    $('#btn-change-round').prop('disabled', false).text('🔄 委員変更（審議やり直し）');
                }
            },
            error: () => {
                toast('通信エラー', true);
                transitionBusy = false;
                $('#btn-change-round').prop('disabled', false).text('🔄 委員変更（審議やり直し）');
            },
        });
    });

    // コメント投稿
    $(document).on('click', '#btn-post-comment', function() {
        const content         = $('#new-comment').val().trim();
        const comment_type    = $('input[name="ctype"]:checked').val() || 'opinion';
        const notifyCommittee = $('#comment-notify-committee').is(':checked');
        if (!content) { toast('コメントを入力してください', true); return; }
        $(this).prop('disabled', true).text('投稿中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/comment`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({
                content, comment_type, notify_committee: notifyCommittee,
            }),
            success(resp) {
                if (resp.success) {
                    appendComment(resp.comment);
                    $('#new-comment').val('');
                    $('#comment-notify-committee').prop('checked', false);
                    if (resp.slack_notified && resp.slack_ok === false) {
                        toast('投稿しました（委員会への通知は失敗しました）', true);
                    } else if (resp.slack_notified) {
                        toast('投稿し、委員会へ通知しました', false);
                    } else {
                        toast('投稿しました', false);
                    }
                } else { toast('エラー: ' + resp.error, true); }
            },
            error: () => toast('通信エラー', true),
            complete: () => $('#btn-post-comment').prop('disabled', false).text('投稿する'),
        });
    });

    // 結論宣言
    $(document).on('click', '#btn-conclude', function() {
        const status   = $('#conclude-status').val();
        const decision = $('#conclude-decision').val().trim();
        const date     = $('#conclude-date').val();
        if (!confirm(`「${STATUS_LABELS[status]}」で確定しますか？\nこの操作は取り消せません。\n確定後、連携審査委員会のSlackチャンネルへ結論を投稿します。`)) return;
        $(this).prop('disabled', true).text('処理中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/conclude`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ status, decision, approved_date: date }),
            success(resp) {
                if (resp.success) {
                    if (resp.slack_ok) {
                        toast('結論を確定し、Slackへ投稿しました', false);
                    } else {
                        toast('結論を確定しました（Slack投稿は失敗。下の「Slack通知」から再投稿できます）', true);
                    }
                    membersCache = null; loadCase();
                } else { toast('エラー: ' + resp.error, true); }
            },
            error: () => toast('通信エラー', true),
            complete: () => $('#btn-conclude').prop('disabled', false).text('✅ 結論を確定する'),
        });
    });

    // 委員の意見表明（投票）
    $(document).on('click', '#btn-vote', function() {
        const vote = $('input[name="vchoice"]:checked').val();
        if (!vote) { toast('承認でよい／意見を控える／不承認 のいずれかを選んでください', true); return; }
        const comment = $('#vote-comment').val().trim();
        $(this).prop('disabled', true).text('送信中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/vote`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ vote, comment }),
            success(resp) {
                if (resp.success) { toast('意見を表明しました', false); loadCase(); }
                else { toast('エラー: ' + resp.error, true);
                       $('#btn-vote').prop('disabled', false).text('意見を表明する'); }
            },
            error: () => { toast('通信エラー', true);
                           $('#btn-vote').prop('disabled', false).text('意見を表明する'); },
        });
    });

    // 期日アラートのON/OFF
    $(document).on('click', '#btn-alert-toggle', function() {
        // 現在ONなら（btnに on クラス）OFFへ、その逆
        const turnOn = $(this).hasClass('off');
        $(this).prop('disabled', true);
        // ON/OFFのみ送る。review_end キーを送らないので審査期限は据え置き。
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/alert`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ enabled: turnOn }),
            success(resp) {
                if (resp.success) {
                    toast(turnOn ? '期日アラートをONにしました' : '期日アラートをOFFにしました', false);
                    loadCase();
                } else { toast('エラー: ' + resp.error, true);
                         $('#btn-alert-toggle').prop('disabled', false); }
            },
            error: () => { toast('通信エラー', true);
                           $('#btn-alert-toggle').prop('disabled', false); },
        });
    });

    // 審査期限の更新（アラート基準日時の変更）
    $(document).on('click', '#btn-alert-deadline', function() {
        const reviewEnd = $('#alert-review-end').val();  // 'YYYY-MM-DDTHH:MM'
        if (!reviewEnd) { toast('審査期限（日時）を入力してください', true); return; }
        // 現在のアラートON/OFF状態を維持したまま期限だけ変更する。
        const keepEnabled = !$('#btn-alert-toggle').hasClass('off');
        if (!confirm(`審査期限を ${reviewEnd.replace('T',' ')} に変更します。\nリマインドはこの新しい期限を基準に再び効きます。よろしいですか？`)) return;
        $(this).prop('disabled', true).text('更新中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/alert`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ enabled: keepEnabled, review_end: reviewEnd }),
            success(resp) {
                if (resp.success) { toast('審査期限を更新しました', false); loadCase(); }
                else { toast('エラー: ' + resp.error, true);
                       $('#btn-alert-deadline').prop('disabled', false).text('審査期限を更新'); }
            },
            error: () => { toast('通信エラー', true);
                           $('#btn-alert-deadline').prop('disabled', false).text('審査期限を更新'); },
        });
    });

    // 結論のSlack再投稿
    $(document).on('click', '#btn-slack-resend', function() {
        $(this).prop('disabled', true).text('投稿中...');
        $.ajax({
            url: `/ext_engagement/api/case/${CASE_ID}/notify_slack`,
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({}),
            success(resp) {
                if (resp.success) { toast('Slackチャンネルへ投稿しました', false); loadCase(); }
                else { toast('エラー: ' + resp.error, true);
                       $('#btn-slack-resend').prop('disabled', false).text('再投稿'); }
            },
            error: () => { toast('通信エラー', true);
                           $('#btn-slack-resend').prop('disabled', false).text('再投稿'); },
        });
    });

    // COI操作
    $(document).on('click', '[data-action]', function() {
        const uid    = $(this).data('uid');
        const action = $(this).data('action');
        if (action === 'coi-full')       setCoi(uid, 'committee', '');
        else if (action === 'coi-chair') setCoi(uid, 'chair_only', '');
        else if (action === 'coi-clear') removeCoi(uid);
        else if (action === 'acting-set')   setActingChair(uid);
        else if (action === 'acting-clear') setActingChair(null);
    });

    // 通知文
    $(document).on('click', '#btn-open-notify', function() {
        $.get(`/ext_engagement/api/case/${CASE_ID}/notify_text`, function(resp) {
            if (!resp.success) { toast('取得エラー: ' + resp.error, true); return; }
            $('#notify-text-content').text(resp.text);
            $('#modal-notify').addClass('show');
        });
    });
    $('#modal-notify-close').on('click', () => $('#modal-notify').removeClass('show'));
    $(document).on('click', '#btn-copy-notify', function() {
        navigator.clipboard.writeText($('#notify-text-content').text())
            .then(() => toast('クリップボードにコピーしました', false));
    });

    // ── 通知記録モーダル（事務局・委員長） ──
    $(document).on('click', '#btn-notify-log', openNotifyLogModal);
    $('#modal-notify-log-close').on('click',
        () => $('#modal-notify-log').removeClass('show'));
}

// 通知記録モーダルを開いて内容を読み込む
function openNotifyLogModal() {
    $('#modal-notify-log').addClass('show');
    $('#notify-log-body').html(
        '<div style="text-align:center;padding:30px;color:#9ca3af;">⏳ 読み込み中...</div>');
    $.get(`/ext_engagement/api/case/${CASE_ID}/notify_log`, function(resp) {
        if (!resp.success) {
            $('#notify-log-body').html(
                `<div style="color:#991b1b;padding:20px;">⚠ ${escHtml(resp.error)}</div>`);
            return;
        }
        let html = '';

        // ── 点検・送信予定 ──
        const plan = resp.plan || {};
        const planColor = plan.active ? '#0e7490' : '#6b7280';
        const planBg    = plan.active ? '#ecfeff' : '#f3f4f6';
        const planBd    = plan.active ? '#a5f3fc' : '#e5e7eb';
        html += `
        <div style="font-size:0.82rem;font-weight:700;color:#374151;margin:2px 0 6px;">
            ⏰ 点検・送信予定
        </div>
        <div style="background:${planBg};border:1px solid ${planBd};border-radius:8px;
                    padding:11px 14px;margin-bottom:18px;font-size:0.85rem;color:${planColor};">
            ${escHtml(plan.message || '')}
        </div>`;

        // ── 送信済みの通知（履歴） ──
        html += `
        <div style="font-size:0.82rem;font-weight:700;color:#374151;margin:2px 0 6px;">
            📋 送信済みの通知
        </div>`;
        const hist = resp.history || [];
        if (!hist.length) {
            html += `<div style="color:#9ca3af;font-size:0.85rem;padding:14px 4px;">
                まだ通知の記録はありません。</div>`;
        } else {
            html += '<div style="display:grid;gap:8px;">';
            hist.forEach(h => {
                const ok = (h.status === 'success');
                const statusBadge = ok
                    ? '<span style="background:#dcfce7;color:#065f46;border-radius:10px;padding:2px 9px;font-size:0.73rem;font-weight:700;">送信成功</span>'
                    : '<span style="background:#fee2e2;color:#991b1b;border-radius:10px;padding:2px 9px;font-size:0.73rem;font-weight:700;">送信失敗</span>';
                const targetIcon = (h.target_kind === 'dm') ? '✉️' : '📢';
                const errLine = (!ok && h.error)
                    ? `<div style="color:#991b1b;font-size:0.8rem;margin-top:3px;">⚠ ${escHtml(h.error)}</div>`
                    : '';
                const byLine = h.created_by_name
                    ? `　操作：${escHtml(h.created_by_name)}` : '';
                const roundLine = (h.round_no && h.round_no >= 2)
                    ? `　第${h.round_no}回` : '';
                html += `
                <div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px 13px;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        ${statusBadge}
                        <span style="font-weight:700;color:#1e3a5f;font-size:0.86rem;">
                            ${escHtml(h.kind_label)}</span>
                        <span style="color:#9ca3af;font-size:0.8rem;">${escHtml(h.created_at)}</span>
                    </div>
                    <div style="font-size:0.82rem;color:#475569;margin-top:4px;">
                        ${targetIcon} ${escHtml(h.target_label)}${roundLine}${byLine}
                    </div>
                    ${h.summary ? `<div style="font-size:0.82rem;color:#64748b;margin-top:2px;">${escHtml(h.summary)}</div>` : ''}
                    ${errLine}
                </div>`;
            });
            html += '</div>';
        }
        $('#notify-log-body').html(html);
    }).fail(() => {
        $('#notify-log-body').html(
            '<div style="color:#991b1b;padding:20px;">⚠ 通信エラー</div>');
    });
}

function appendComment(cm) {
    const cls  = cm.is_conclusion ? 'conclusion' : cm.comment_type;
    const html = `
    <div class="comment-item ${cls}">
        <div class="comment-header">
            ${commentTypeLabel(cm.is_conclusion ? 'conclusion' : cm.comment_type)}
            <span class="comment-author">${escHtml(cm.author_name)}</span>
            <span>${cm.created_at}</span>
        </div>
        <div class="comment-body">${escHtml(cm.content)}</div>
    </div>`;
    const $list = $('#comment-list');
    $list.find('.empty-comment').remove();
    $list.append(html);
}

function setCoi(uid, excluded_roles, reason) {
    $.ajax({
        url: `/ext_engagement/api/case/${CASE_ID}/coi/add`,
        method: 'POST', contentType: 'application/json',
        data: JSON.stringify({ user_id: uid, reason, excluded_roles }),
        success(resp) {
            if (resp.success) { toast('COIを設定しました', false); membersCache = null; reloadAdminPanel(); }
            else { toast('エラー: ' + resp.error, true); }
        },
        error: () => toast('通信エラー', true),
    });
}

function removeCoi(uid) {
    $.ajax({
        url: `/ext_engagement/api/case/${CASE_ID}/coi/remove`,
        method: 'POST', contentType: 'application/json',
        data: JSON.stringify({ user_id: uid }),
        success(resp) {
            if (resp.success) { toast('COIを解除しました', false); membersCache = null; reloadAdminPanel(); }
            else { toast('エラー: ' + resp.error, true); }
        },
        error: () => toast('通信エラー', true),
    });
}

function setActingChair(uid) {
    $.ajax({
        url: `/ext_engagement/api/case/${CASE_ID}/acting_chair`,
        method: 'POST', contentType: 'application/json',
        data: JSON.stringify({ user_id: uid }),
        success(resp) {
            if (resp.success) { toast(uid ? '代理委員長を指名しました' : '代理委員長を解除しました', false); membersCache = null; reloadAdminPanel(); }
            else { toast('エラー: ' + resp.error, true); }
        },
        error: () => toast('通信エラー', true),
    });
}

function reloadAdminPanel() {
    $.get(`/ext_engagement/api/case/${CASE_ID}`, function(resp) {
        if (!resp.success) return;
        if (resp.case.status === 'draft') {
            loadMembersForAdmin(resp.coi_info, resp.acting_chair_info);
        }
    });
}

function updateEditTotalFeeDisplay() {
    const d = parseInt($('#edit-direct-fee').val()) || 0;
    const i = parseInt($('#edit-indirect-fee').val()) || 0;
    const dEmpty = $('#edit-direct-fee').val().trim() === '';
    const iEmpty = $('#edit-indirect-fee').val().trim() === '';
    if (dEmpty && iEmpty) {
        $('#edit-total-fee-display').text('―');
    } else {
        const total = d + i;
        $('#edit-total-fee-display').text(total.toLocaleString('ja-JP') + ' 円'
            + (dEmpty || iEmpty ? '　※片方未入力' : ''));
    }
}

function showEditRepBadge(uid, name) {
    $('#edit-rep-user-selected').html(`
        <span class="user-selected-badge">
            👤 ${escHtml(name)}
            <button class="clear-btn" id="btn-edit-clear-rep">✕</button>
        </span>`);
}

$(document).ready(loadCase);
</script>

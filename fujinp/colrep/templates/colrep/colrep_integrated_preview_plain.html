<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.プロジェクト名 }} - 統合プレビュー</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <style>
        body { 
            font-family: serif; 
            line-height: 1.6; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h1, h2, h3 { color: #333; }
        pre { 
            background: #f5f5f5; 
            padding: 10px; 
            border-radius: 5px; 
            overflow-x: auto; 
        }
        code { 
            background: #f5f5f5; 
            padding: 2px 4px; 
            border-radius: 3px; 
        }
        .katex { font-size: 1.1em !important; }
        .mermaid { text-align: center; }
        .sql-result-table { 
            border-collapse: collapse; 
            margin: 1em auto; 
            width: 100%; 
            font-size: 14px; 
        }
        .sql-result-table th, .sql-result-table td { 
            border: 1px solid #ddd; 
            padding: 6px; 
            text-align: left; 
            vertical-align: top; 
            word-wrap: break-word; 
        }
        .sql-result-table th { background-color: #f2f2f2; }
        .table-container { width: 100%; overflow-x: auto; }
        .svg-container { text-align: center; margin: 1em 0; }
        .svg-container svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    {% if error %}
        <div>
            <h1>エラー</h1>
            <p>{{ error }}</p>
        </div>
    {% else %}
        <div id="integrated-content">
            {{ integrated_content | safe }}
        </div>
    {% endif %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- KaTeX JavaScript -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- Mermaid JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mermaid初期化
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: true });
                // 既存のMermaid要素を再処理
                mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
            }
            
            // KaTeX数式処理
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('integrated-content'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        });
    </script>
</body>
</html>
